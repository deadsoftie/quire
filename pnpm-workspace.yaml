packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  electron: true
  esbuild: true
# @codemirror/language@6.12.4 pins @codemirror/view@6.43.6 specifically, while every other
# CodeMirror package (and packages/ui itself) resolves ^6.43.7 -- two separate module instances of
# @codemirror/view meant a ViewPlugin built by @codemirror/language's copy (the syntax highlighter)
# was never recognized as a real extension by an EditorView built from the other copy, so
# highlighting silently never reached the DOM despite computing correctly in isolation.
overrides:
  "@codemirror/view": ^6.43.7
