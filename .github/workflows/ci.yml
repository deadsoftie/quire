name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  gate:
    name: CI toggle
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      # Flip to "false" to disable every job below - env isn't valid in job-level `if:`, so this output is.
      - id: check
        run: echo "enabled=true" >> "$GITHUB_OUTPUT"

  test:
    name: Test (cargo + vitest)
    needs: [gate]
    runs-on: ubuntu-latest
    if: needs.gate.outputs.enabled == 'true'
    steps:
      - uses: actions/checkout@v4

      # Tectonic's bridge crates (fontconfig, freetype2, graphite2, harfbuzz, icu, png) link system libs, not vendored ones.
      - name: Install Tectonic system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libgraphite2-dev libharfbuzz-dev libicu-dev libpng-dev libssl-dev zlib1g-dev pkg-config

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Cache cargo target (Tectonic's vendored C/C++ build is the slow part)
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-

      - name: Cache core bundle
        id: cache-core-bundle
        uses: actions/cache@v4
        with:
          path: bundles/core
          key: bundles-core-${{ hashFiles('bundles/manifest.json') }}

      # bundles/core/ is gitignored; several integration tests panic without it.
      - name: Build core bundle
        if: steps.cache-core-bundle.outputs.cache-hit != 'true'
        run: cargo run -p quire-core --example build_core_bundle

      # system_tex.rs self-skips with no system TeX install present, no gating needed.
      - run: cargo test --workspace

      - run: pnpm --filter @quire/ui test

  build:
    name: Build + publish (${{ matrix.target }})
    needs: [gate, test]
    if: needs.gate.outputs.enabled == 'true' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tectonic system dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libgraphite2-dev libharfbuzz-dev libicu-dev libpng-dev libssl-dev zlib1g-dev pkg-config

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-target-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-target-release-${{ runner.os }}-

      - name: Cache core bundle
        id: cache-core-bundle
        uses: actions/cache@v4
        with:
          path: bundles/core
          key: bundles-core-${{ hashFiles('bundles/manifest.json') }}

      - name: Build core bundle
        if: steps.cache-core-bundle.outputs.cache-hit != 'true'
        run: cargo run -p quire-core --example build_core_bundle

      # Builds a fresh keychain per run since CI has no pre-populated one to auto-discover (CI_PLAN.md).
      - name: Import macOS signing certificate
        if: matrix.target == 'mac'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ci-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          rm -f "$CERT_PATH"

      - name: Decode notarization API key
        if: matrix.target == 'mac'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Package + publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm package -- --${{ matrix.target }} --publish=always
